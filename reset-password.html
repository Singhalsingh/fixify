        * {

<body>

<div class="reset-container">

    <div class="logo">FIXIFY</div>

    <div class="icon-box">
        <i class="fa-solid fa-lock"></i>
    </div>

    <h2>Reset Password</h2>

    <p class="description">
        Create a new password for your Fixify account.
    </p>

    <form id="resetPasswordForm">

        <div class="input-group">
            <label for="password">New Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>
        </div>

        <button type="submit" class="reset-btn">
            <i class="fa-solid fa-key"></i>
            Update Password
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="back-login">
        <a href="login.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
    </div>

</div>

<script>
    const API_URL = "https://fixify-backend-eq17.onrender.com";

    const form = document.getElementById("resetPasswordForm");
    const message = document.getElementById("message");
    const submitBtn = form.querySelector(".reset-btn");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        form.style.display = "none";
        message.style.display = "block";
        message.style.background = "rgba(239,68,68,0.12)";
        message.style.color = "#f87171";
        message.textContent = "Invalid reset link. Please request a new password reset link.";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (!token) return;

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            showMessage("Password must be at least 8 characters.", "error");
            return;
        }

        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

        try {
            const response = await fetch(
                `${API_URL}/api/users/reset-password/${encodeURIComponent(token)}`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password })
                }
            );

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(data.message || "Password reset failed.");
            }

            showMessage("Password updated successfully! Redirecting to login...", "success");

            form.reset();

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2500);

        } catch (error) {
            console.error("Reset Password Error:", error);
            showMessage(error.message, "error");

        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML =
                '<i class="fa-solid fa-key"></i> Update Password';
        }
    });

    function showMessage(text, type) {
        message.style.display = "block";

        if (type === "success") {
            message.style.background = "rgba(34,197,94,0.12)";
            message.style.color = "#4ade80";
        } else {
            message.style.background = "rgba(239,68,68,0.12)";
            message.style.color = "#f87171";
        }

        message.textContent = text;
    }
</script>

</body>
</html>
