<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Fixify</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #020617;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.hidden {
            left: -220px;
        }

        .sidebar h2 {
            color: #0ea6e7;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #cbd5f5;
            text-decoration: none;
            margin: 15px 0;
        }

        .sidebar a:hover {
            color: #38bdf8;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
            transition: margin-left 0.3s ease;
            margin-left: 220px;
            min-width: 0;
        }

        .main.shifted {
            margin-left: 0;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 60px;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* HAMBURGER */
        .hamburger {
            font-size: 24px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            z-index: 1100;
            position: fixed;
            left: 10px;
            top: 10px;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 25px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* TABLE */
        .table {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .table h3 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            color: #94a3b8;
        }

        tr {
            border-bottom: 1px solid #334155;
        }

        /* STATUS */
        .pending {
            color: orange;
        }

        .completed {
            color: #22c55e;
        }

        .confirmed {
            color: #38bdf8;
        }

        .cancelled {
            color: #f87171;
        }

        /* BUTTON */
        .btn {
            padding: 8px 12px;
            background: #0ea6e7;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0284c7;
        }

        .logout {
            margin-top: 20px;
            display: block;
            color: #f87171 !important;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
        }

        .refresh-info {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 12px;
        }

        @media(max-width: 768px) {
            .sidebar {
                left: -220px;
            }

            .sidebar.show {
                left: 0;
            }

            .main {
                margin-left: 0;
            }

            .header {
                padding-left: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- HAMBURGER -->
    <button class="hamburger" id="toggleButton">☰</button>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">

        <h2>Fixify</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="booking.html">My Bookings</a>
        <a href="profile.html">Profile</a>
        <a href="index.html">Back to Home</a>

        <a href="#" class="logout" id="logoutButton">Logout</a>

    </div>

    <!-- MAIN -->
    <div class="main" id="mainContent">

        <div class="header">
            <h1 id="welcomeMessage">Welcome, User </h1>
        </div>

        <!-- STATS -->
        <div class="cards">

            <div class="card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="card">
                <h3>Pending Services</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedBookings">0</p>
            </div>

        </div>

        <!-- BOOKINGS TABLE -->
        <div class="table">

            <h3>My Bookings</h3>

            <table>

                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="bookingTableBody">

                    <tr>
                        <td colspan="5" class="message">
                            Loading your bookings...
                        </td>
                    </tr>

                </tbody>

            </table>

            <p class="refresh-info">
                Dashboard automatically refreshes every 15 seconds.
            </p>

        </div>

    </div>

    <script>

        // BACKEND API
        const API_URL = "https://fixify-backend-eq17.onrender.com";

        let refreshInterval;

        // HTML SECURITY
        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        // FORMAT DATE
        function formatDate(dateValue) {

            if (!dateValue) return "N/A";

            const date = new Date(dateValue);

            if (isNaN(date.getTime())) {
                return escapeHTML(dateValue);
            }

            return date.toLocaleDateString("en-IN");
        }

        // LOAD USER DATA
        function loadUserData() {

            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "login.html";
                return false;
            }

            try {

                const userData = JSON.parse(
                    localStorage.getItem("user") || "{}"
                );

                if (userData.name) {
                    document.getElementById("welcomeMessage").textContent =
                        `Welcome, ${userData.name} 👋`;
                }

            } catch (error) {
                console.error("User Data Error:", error);
            }

            return true;
        }

        // STATUS CLASS
        function getStatusClass(status) {

            const value = String(status || "Pending").toLowerCase();

            if (value === "completed") return "completed";

            if (value === "confirmed") return "confirmed";

            if (value === "cancelled") return "cancelled";

            return "pending";
        }

        // LOAD CUSTOMER BOOKINGS
        async function loadBookings() {

            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const tableBody = document.getElementById("bookingTableBody");

            try {

                const response = await fetch(
                    `${API_URL}/api/bookings/my-bookings`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to load bookings");
                }

                const bookings = data.bookings || [];

                // UPDATE STATS
                const pending = bookings.filter(booking =>
                    String(booking.status || "Pending").toLowerCase() === "pending"
                ).length;

                const completed = bookings.filter(booking =>
                    String(booking.status || "").toLowerCase() === "completed"
                ).length;

                document.getElementById("totalBookings").textContent =
                    bookings.length;

                document.getElementById("pendingBookings").textContent =
                    pending;

                document.getElementById("completedBookings").textContent =
                    completed;

                // EMPTY BOOKINGS
                if (bookings.length === 0) {

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="message">
                                No bookings found. Book your first service!
                            </td>
                        </tr>
                    `;

                    return;
                }

                // DISPLAY BOOKINGS
                tableBody.innerHTML = bookings.map(booking => {

                    const status = booking.status || "Pending";

                    return `
                        <tr>
                            <td>${escapeHTML(booking.service)}</td>

                            <td>${formatDate(booking.date)}</td>

                            <td>${escapeHTML(booking.time || "N/A")}</td>

                            <td class="${getStatusClass(status)}">
                                ${escapeHTML(status)}
                            </td>

                            <td>
                                <button
                                    class="btn"
                                    onclick="viewBooking('${escapeHTML(booking._id)}')">
                                    View
                                </button>
                            </td>
                        </tr>
                    `;

                }).join("");

            } catch (error) {

                console.error("Booking Fetch Error:", error);

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="message">
                            Unable to load bookings. Please try again.
                        </td>
                    </tr>
                `;
            }
        }

        // VIEW BOOKING
        function viewBooking(id) {

            alert("Booking ID: " + id);
        }

        // SIDEBAR TOGGLE
        const toggleButton = document.getElementById("toggleButton");
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");

        toggleButton.addEventListener("click", () => {

            sidebar.classList.toggle("hidden");
            sidebar.classList.toggle("show");

            mainContent.classList.toggle("shifted");

        });

        // LOGOUT
        document.getElementById("logoutButton")
            .addEventListener("click", event => {

                event.preventDefault();

                clearInterval(refreshInterval);

                localStorage.removeItem("user");
                localStorage.removeItem("token");

                window.location.href = "login.html";

            });

        // INITIALIZE DASHBOARD
        window.addEventListener("DOMContentLoaded", () => {

            if (!loadUserData()) return;

            loadBookings();

            // AUTO REFRESH EVERY 15 SECONDS
            refreshInterval = setInterval(loadBookings, 15000);

        });

    </script>

</body>
</html>
