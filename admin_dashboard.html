<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fixify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #0b0f19;
            height: 100vh;
            padding: 20px;
        }
        .sidebar h2 {
            color: #4f46e5;
        }
        .sidebar a {
            display: block;
            color: #9ca3af;
            text-decoration: none;
            padding: 12px 0;
            font-size: 16px;
        }
        .sidebar a:hover {
            color: #22c55e;
        }
        .main-content {
            flex: 1;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2937;
            padding-bottom: 20px;
        }
        .overview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #1f2937;
            padding: 25px;
            border-radius: 8px;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #9ca3af;
        }
        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Fixify Admin</h2>
        <a href="#" style="color:white; font-weight:bold;">Dashboard Overview</a>
        <a href="#">User Management</a>
        <a href="#">Booking Management</a>
        <a href="#">Service Management</a>
        <a href="#">Settings</a>
        <a href="dashboard.html" style="color:red; margin-top: 20px;">Exit Admin</a>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Welcome, Admin 👨‍💻</h1>
        </div>
        
        <div class="overview-cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1,250</p>
            </div>
            <div class="card">
                <h3>Total Bookings</h3>
                <p>875</p>
            </div>
            <div class="card">
                <h3>Active Services</h3>
                <p>15</p>
            </div>
            <div class="card">
                <h3>Total Revenue</h3>
                <p>₹ 15,750</p>
            </div>
        </div>
    </div>
</body>
</html>
