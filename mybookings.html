<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Fixify</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* UNIFIED SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #020617;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            transition: left 0.3s ease;
            z-index: 1000;
            border-right: 1px solid #1e293b;
        }

        .sidebar.hidden {
            left: -240px;
        }

        .sidebar h2 {
            color: #0ea6e7;
            margin-bottom: 30px;
            padding-left: 42px;
            font-size: 24px;
            line-height: 32px;
        }

        .sidebar a {
            display: block;
            color: #cbd5f5;
            text-decoration: none;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #38bdf8;
            font-weight: bold;
        }

        .sidebar a.logout {
            margin-top: 25px;
            color: #f87171 !important;
        }

        /* HAMBURGER / CLOSE BUTTON */
        .hamburger {
            width: 38px;
            height: 38px;
            font-size: 22px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            z-index: 1100;
            position: fixed;
            left: 14px;
            top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 25px;
            transition: margin-left 0.3s ease;
            margin-left: 240px;
            min-width: 0;
        }

        .main.shifted {
            margin-left: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 50px;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* TABLE */
        .table {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .table h3 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #38bdf8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            color: #94a3b8;
        }

        tr {
            border-bottom: 1px solid #334155;
        }

        .pending { color: orange; }
        .completed { color: #22c55e; }
        .confirmed { color: #38bdf8; }
        .cancelled { color: #f87171; }

        .btn {
            padding: 8px 12px;
            background: #0ea6e7;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0284c7;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
        }

        @media(max-width: 768px) {
            .sidebar {
                left: -240px;
            }
            .sidebar.show {
                left: 0;
            }
            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <button class="hamburger" id="toggleButton" aria-label="Toggle Menu">☰</button>

    <div class="sidebar" id="sidebar">
        <h2>Fixify</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="mybookings.html" class="active">My Bookings</a>
        <a href="profile.html">Profile</a>
        <a href="index.html">Back to Home</a>
        <a href="#" class="logout" id="logoutButton">Logout</a>
    </div>

    <div class="main" id="mainContent">
        <div class="header">
            <h1 id="welcomeMessage">My Bookings 📅</h1>
        </div>

        <div class="table">
            <h3>Booking History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    <tr>
                        <td colspan="5" class="message">Loading your booking history...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://fixify-backend-eq17.onrender.com";

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function formatDate(dateValue) {
            if (!dateValue) return "N/A";
            const date = new Date(dateValue);
            if (isNaN(date.getTime())) return escapeHTML(dateValue);
            return date.toLocaleDateString("en-IN");
        }

        function getStatusClass(status) {
            const value = String(status || "Pending").toLowerCase();
            if (value === "completed") return "completed";
            if (value === "confirmed") return "confirmed";
            if (value === "cancelled") return "cancelled";
            return "pending";
        }

        async function fetchMyBookings() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const tableBody = document.getElementById("bookingTableBody");

            try {
                const response = await fetch(`${API_URL}/api/bookings/my-bookings`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                const data = await response.json();

                if (response.status === 401) {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to load bookings");
                }

                const bookings = data.bookings || [];

                if (bookings.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="message">No bookings found. Book your first service!</td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = bookings.map(booking => {
                    const status = booking.status || "Pending";
                    return `
                        <tr>
                            <td>${escapeHTML(booking.service)}</td>
                            <td>${formatDate(booking.date)}</td>
                            <td>${escapeHTML(booking.time || "N/A")}</td>
                            <td class="${getStatusClass(status)}"><strong>${escapeHTML(status)}</strong></td>
                            <td>
                                <button class="btn" onclick="viewBooking('${escapeHTML(booking._id)}')">View</button>
                            </td>
                        </tr>
                    `;
                }).join("");

            } catch (error) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="message" style="color: #f87171;">
                            Unable to load bookings. Please try again.
                        </td>
                    </tr>
                `;
            }
        }

        function viewBooking(id) {
            alert("Booking ID: " + id);
        }

        // SIDEBAR TOGGLE WITH ☰ <-> ✕ ICON CHANGE
        const toggleButton = document.getElementById("toggleButton");
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");

        function updateHamburgerIcon() {
            const isMobile = window.innerWidth <= 768;
            const isOpen = isMobile
                ? sidebar.classList.contains("show")
                : !sidebar.classList.contains("hidden");
            toggleButton.textContent = isOpen ? "✕" : "☰";
        }

        toggleButton.addEventListener("click", () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle("show");
            } else {
                sidebar.classList.toggle("hidden");
                mainContent.classList.toggle("shifted");
            }
            updateHamburgerIcon();
        });

        window.addEventListener("resize", updateHamburgerIcon);

        document.getElementById("logoutButton").addEventListener("click", event => {
            event.preventDefault();
            localStorage.removeItem("user");
            localStorage.removeItem("token");
            window.location.href = "login.html";
        });

        window.addEventListener("DOMContentLoaded", () => {
            updateHamburgerIcon();
            fetchMyBookings();
        });
    </script>
</body>

</html>
