<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Service | Fixify</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1581578731548-c64695cc6952");

background-size:cover;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.container{

width:100%;
max-width:550px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

padding:35px;

border-radius:20px;

color:white;

}

h1{

text-align:center;

margin-bottom:25px;

}

.input{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

}

input,
textarea,
select{

width:100%;

padding:14px;

border:none;

border-radius:10px;

outline:none;

}

textarea{

resize:none;

height:100px;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}

.btn{

width:100%;

padding:14px;

border:none;

background:#0ea5e9;

color:white;

border-radius:12px;

font-size:16px;

cursor:pointer;

}

.btn:hover{

opacity:.9;

}

.success{

display:none;

margin-top:15px;

padding:15px;

background:#22c55e;

border-radius:10px;

text-align:center;

}

@media(max-width:768px){

.row{

grid-template-columns:1fr;

}

.container{

padding:25px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>
Book Your Service
</h1>

<form id="bookingForm">

<div class="input">

<label>
Service
</label>

<input
type="text"
id="service"
readonly>

</div>

<div class="input">

<label>
Full Name
</label>

<input
type="text"
id="name"
required>

</div>

<div class="input">

<label>
Phone Number
</label>

<input
type="tel"
id="phone"
required>

</div>

<div class="row">

<div class="input">

<label>
Booking Date
</label>

<input
type="date"
id="date"
required>

</div>

<div class="input">

<label>
Time
</label>

<input
type="time"
id="time"
required>

</div>

</div>

<div class="input">

<label>
Address
</label>

<textarea
id="address"
required></textarea>

</div>

<div class="input">

<label>
Extra Notes
</label>

<textarea
id="notes"></textarea>

</div>

<button class="btn">
Confirm Booking
</button>

<div class="success" id="success">

 Booking Submitted Successfully

</div>

</form>

</div>

<script>

/* GET SERVICE */

const params =
new URLSearchParams(
window.location.search
);

document
.getElementById("service")
.value =
params.get("service")
|| "General Service";

/* FORM */

document
.getElementById(
"bookingForm"
)

.addEventListener(
"submit",

function(e){

e.preventDefault();

const name =
document
.getElementById("name")
.value;

const phone =
document
.getElementById("phone")
.value;

if(
name.length<3
){

alert(
"Enter valid name"
);

return;

}

if(
phone.length<10
){

alert(
"Enter valid number"
);

return;

}

document
.getElementById(
"success"
)

.style.display=
"block";

setTimeout(()=>{

window.location.href=
"project2.html";

},2500);

}

);

</script>

</body>
</html>
