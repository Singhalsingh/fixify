<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service | Fixify</title>
    
    <!-- Axios Library for Backend Communication -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            background: #0ea5e9;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #22c55e;
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        @media(max-width: 768px){
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Book Your Service</h1>
        
        <form id="bookingForm">
            <div class="input-group">
                <label for="service">Service Required</label>
                <input type="text" id="service" placeholder="Enter service name (e.g., Electrician, Plumbing)" required>
            </div>

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Your mobile number" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Your active email" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="date">Booking Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="input-group">
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time" required>
                </div>
            </div>

            <div class="input-group">
                <label for="address">Service Address</label>
                <textarea id="address" placeholder="Enter complete home address" required></textarea>
            </div>

            <div class="input-group">
                <label for="notes">Extra Notes / Requirements (Optional)</label>
                <textarea id="notes" placeholder="Any specific instruction for fixify technician..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Confirm Booking</button>

            <div class="alert-message success" id="successAlert">
                Booking Submitted Successfully! Redirecting to Dashboard...
            </div>
        </form>
        
        <a href="dashboard.html" class="back-link">← Cancel & Back to Dashboard</a>
    </div>

    <script>
        // BACKEND BASE API URL
        const API_URL = "https://fixify-backend-eq17.onrender.com";

        /* ----------------------------------------------------
           1. AUTO PRE-FILL SERVICE FROM URL PARAMETER
           (e.g., book.html?service=Electrician)
           ---------------------------------------------------- */
        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const serviceParam = params.get("service");
            if (serviceParam) {
                document.getElementById("service").value = serviceParam;
            }

            // Also secure check if the user is already logged in
            const token = localStorage.getItem("token");
            if (!token) {
                alert("Please log in first to book a service!");
                window.location.href = "login.html";
                return;
            }

            // Autofill user's profile info if saved locally
            try {
                const userData = JSON.parse(localStorage.getItem("user") || "{}");
                if (userData.name) document.getElementById("name").value = userData.name;
                if (userData.email) document.getElementById("email").value = userData.email;
                if (userData.phoneNumber) document.getElementById("phone").value = userData.phoneNumber;
            } catch (err) {
                console.error("Local user retrieval error:", err);
            }
        });

        /* ----------------------------------------------------
           2. SECURE FORM SUBMISSION WITH AUTHORIZATION TOKEN
           ---------------------------------------------------- */
        document.getElementById("bookingForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const token = localStorage.getItem("token");
            if (!token) {
                alert("Session expired. Please log in again.");
                window.location.href = "login.html";
                return;
            }

            const service = document.getElementById("service").value;
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;
            const address = document.getElementById("address").value;
            const notes = document.getElementById("notes").value;

            // Mapping keys perfectly with Backend Schema Model
            const bookingData = {
                service,
                name,
                phone,
                email,
                date,
                time,
                address,
                notes: notes || ""
            };

            // Post request including Authorization Header
            axios.post(`${API_URL}/api/bookings/create-booking`, bookingData, {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            })
            .then(function(response) {
                console.log("Booking Success Response:", response.data);

                // Show Success Alert
                const successAlert = document.getElementById("successAlert");
                successAlert.style.display = "block";
                document.getElementById("bookingForm").reset();

                // Smoothly redirecting to Dashboard to view updated bookings
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 2000);
            })
            .catch(function(error) {
                console.error("Booking Endpoint Error:", error.response?.data || error.message);
                
                alert(
                    error.response?.data?.message || 
                    "Booking submit nahi ho paayi. Please try again or check backend connection."
                );
            });
        });
    </script>

</body>
</html>
