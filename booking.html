<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service | Fixify</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(2, 6, 23, 0.7);
            border-radius: 10px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            background: #0ea5e9;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease, opacity 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: #0284c7;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.75;
        }

        /* Lock entire form while submitting */
        .form-locked {
            pointer-events: none;
            opacity: 0.75;
        }

        .alert-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #22c55e;
            color: white;
        }

        .error {
            background: #ef4444;
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        @media(max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="bookingContainer">
        <h1>Book Your Service</h1>

        <form id="bookingForm">
            <div class="input-group">
                <label for="service">Service Required</label>
                <input type="text" id="service" placeholder="Enter service name (e.g., Electrician, Plumbing)" required>
            </div>

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Your active email" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="date">Booking Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="input-group">
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time" required>
                </div>
            </div>

            <div class="input-group">
                <label for="address">Service Address</label>
                <textarea id="address" placeholder="Enter complete home address" required></textarea>
            </div>

            <div class="input-group">
                <label for="notes">Extra Notes / Requirements (Optional)</label>
                <textarea id="notes" placeholder="Any specific instruction for Fixify technician..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Confirm Booking</button>

            <div class="alert-message" id="statusAlert"></div>
        </form>

        <a href="dashboard.html" class="back-link" id="cancelLink">← Cancel & Back to Dashboard</a>
    </div>

    <script>
        const API_URL = "https://fixify-backend-eq17.onrender.com";
        let isSubmitting = false;

        // Helper to get today's local date in YYYY-MM-DD format
        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        window.addEventListener("DOMContentLoaded", () => {
            // 1. Block past dates in the date picker
            const dateInput = document.getElementById("date");
            const todayStr = getTodayDateString();
            dateInput.min = todayStr;
            dateInput.value = todayStr;

            // 2. Pre-fill service from URL parameter
            const params = new URLSearchParams(window.location.search);
            const serviceParam = params.get("service");
            if (serviceParam) {
                document.getElementById("service").value = serviceParam;
            }

            // 3. Check login token
            const token = localStorage.getItem("token");
            if (!token) {
                alert("Please log in first to book a service!");
                window.location.href = "login.html";
                return;
            }

            // 4. Pre-fill user details
            try {
                const userData = JSON.parse(localStorage.getItem("user") || "{}");
                if (userData.name) document.getElementById("name").value = userData.name;
                if (userData.email) document.getElementById("email").value = userData.email;
                if (userData.phoneNumber || userData.phone) {
                    document.getElementById("phone").value = userData.phoneNumber || userData.phone;
                }
            } catch (err) {
                console.error("Local user retrieval error:", err);
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById("statusAlert");
            alertBox.textContent = message;
            alertBox.className = `alert-message ${type}`;
            alertBox.style.display = "block";
        }

        document.getElementById("bookingForm").addEventListener("submit", function(e) {
            e.preventDefault();

            // Prevent multiple taps / duplicate submissions
            if (isSubmitting) return;

            const token = localStorage.getItem("token");
            if (!token) {
                alert("Session expired. Please log in again.");
                window.location.href = "login.html";
                return;
            }

            const service = document.getElementById("service").value.trim();
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;
            const address = document.getElementById("address").value.trim();
            const notes = document.getElementById("notes").value.trim();

            // Strict Past Date Validation
            const todayStr = getTodayDateString();
            if (date < todayStr) {
                showAlert("You cannot book a service for a past date! Please select today or a future date.", "error");
                return;
            }

            // Lock UI & Disable button immediately
            isSubmitting = true;
            const submitBtn = document.getElementById("submitBtn");
            const container = document.getElementById("bookingContainer");
            submitBtn.disabled = true;
            submitBtn.textContent = "Booking in progress... Please wait ⏳";
            container.classList.add("form-locked");

            const bookingData = {
                service,
                name,
                phone,
                email,
                date,
                time,
                address,
                notes: notes || ""
            };

            axios.post(`${API_URL}/api/bookings/create-booking`, bookingData, {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            })
            .then(function() {
                showAlert("Booking Submitted Successfully! Redirecting to Dashboard...", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            })
            .catch(function(error) {
                // Unlock UI only if request failed so user can retry
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = "Confirm Booking";
                container.classList.remove("form-locked");

                showAlert(
                    error.response?.data?.message || "Unable to submit booking. Please try again.",
                    "error"
                );
            });
        });

window.addEventListener("DOMContentLoaded", () => {
    const dateInput = document.getElementById("date");

    // Aaj ki exact local date nikalte hain (YYYY-MM-DD)
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const todayStr = `${year}-${month}-${day}`;

    // 1. Calendar mein aaj se pehle ki saari dates DISABLE kar do:
    dateInput.min = todayStr;
    dateInput.value = todayStr; // Default aaj ki date select rahegi
});

// Form submit hone se pehle extra check:
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    const selectedDate = document.getElementById("date").value;
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const todayStr = `${year}-${month}-${day}`;

    if (selectedDate < todayStr) {
        e.preventDefault();
        alert("You cannot select a past date! Please choose today or a future date.");
        return;
    }
});
    </script>

</body>
</html>
