<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Services</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 50px;
  background: rgba(2, 6, 23, 0.9);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  color: #0ea6e7;
}

nav a {
  color: white;
  margin: 0 15px;
  text-decoration: none;
  transition: 0.3s;
  font-weight: 500;
}

nav a:hover {
  color: #0ea6e7;
}

.hero {
  height: 60vh;
  background: 
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('logo.jpg') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 2.5rem;
}

.hero p {
  margin-top: 10px;
  font-size: 1.2rem;
  color: #cdd7f9;
}
.services-container {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 60px 20px;
  flex-wrap: wrap;
}

.card {
  background: 
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1611021061218-761c355ed331') center/cover no-repeat;
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 15px;
  width: 230px;
  text-align: center;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.1);
}

.card i {
  font-size: 45px;
  margin-bottom: 15px;
  color: #22c55e;
}

.card h2 {
  margin-bottom: 10px;
}

.card p {
  font-size: 14px;
  color: #cbd5f5;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
}
button {
  margin-top: 15px;
  padding: 10px 15px;
  background: linear-gradient(45deg, #22c55e, #4ade80);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

footer {
  text-align: center;
  padding: 20px;
  background: #020617;
  margin-top: 30px;
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">FIXIFY</div>
  <nav>
    <a href="project2.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="about.html">About Us</a>
  </nav>
</header>

<div class="hero">
  <h1>Find Trusted Services Near You</h1>
  <p>Plumber, Electrician, Carpenter – All in One Platform</p>
</div>

<div class="services-container">

  <div class="card">
    <i class="fas fa-wrench"></i>
    <h2>Plumber</h2>
    <p>Fix pipes, leakage & bathroom issues</p>
    <button onclick="window.location.href='booking.html?service=Plumber'">Book Now</button>
  </div>

  <div class="card">
    <i class="fas fa-bolt"></i>
    <h2>Electrician</h2>
    <p>Wiring, fan, lights & repair work</p>
    <button onclick="window.location.href='booking.html?service=Electrician'">Book Now</button>
  </div>

  <div class="card">
    <i class="fas fa-hammer"></i>
    <h2>Carpenter</h2>
    <p>Furniture repair & wood work</p>
    <button onclick="window.location.href='booking.html?service=Carpenter'">Book Now</button>
  </div>

</div>
<footer>
  <p>© 2026 Fixify | Contact: 99972XXXXX</p>
</footer>

</body>
</html>
