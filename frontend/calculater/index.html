<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scientific Calculator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
    }

    .calculator{
      background:#1f2937;
      padding:20px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
      width:380px;
      animation:popup 0.5s ease;
    }

    #display{
      width:100%;
      height:70px;
      border:none;
      outline:none;
      background:#111827;
      color:white;
      font-size:2rem;
      text-align:right;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    button{
      height:60px;
      border:none;
      border-radius:12px;
      font-size:1.1rem;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.05);
    }

    button:active{
      transform:scale(0.92);
    }

    .number{
      background:#374151;
      color:white;
    }

    .operator{
      background:#f59e0b;
      color:white;
    }

    .equal{
      background:#10b981;
      color:white;
      grid-column:span 2;
    }

    .clear{
      background:#ef4444;
      color:white;
    }

    .calculator:hover{
      box-shadow:0 0 25px rgba(255,255,255,0.15);
    }

    @keyframes popup{
      0%{
        transform:scale(0.7);
        opacity:0;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    @media (max-width:500px){

      .calculator{
        width:95%;
        padding:15px;
      }

      #display{
        height:60px;
        font-size:1.5rem;
      }

      button{
        height:55px;
        font-size:1rem;
      }
    }

  </style>
</head>

<body>

  <div class="calculator">

    <input 
      type="text" 
      id="display" 
      readonly 
      aria-label="Calculator display"
    >

    <div class="buttons">

    
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="backspace()">⌫</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      
      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

     
      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

    
      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>
      <button class="number" onclick="appendValue('.')">.</button>

      <button class="number" onclick="appendValue('0')">0</button>
      <button class="operator" onclick="appendValue('3.14159')">π</button>
      <button class="operator" onclick="appendValue('**2')">x²</button>
      <button class="operator" onclick="appendValue('Math.sqrt(')">√</button>

    
      <button class="operator" onclick="appendValue('Math.sin(')">sin</button>
      <button class="operator" onclick="appendValue('Math.cos(')">cos</button>
      <button class="operator" onclick="appendValue('Math.tan(')">tan</button>
      <button class="operator" onclick="appendValue('Math.log10(')">log</button>

      <button class="equal" onclick="calculate()">=</button>

    </div>

  </div>

  <script>

    const display = document.getElementById("display");

    function appendValue(value){
      display.value += value;
    }

    function clearDisplay(){
      display.value = "";
    }

    function backspace(){
      display.value = display.value.slice(0,-1);
    }

    function calculate(){

      try{
        display.value = eval(display.value);
      }

      catch{
        display.value = "Error";
      }
    }

    document.addEventListener("keydown", (event) => {

      const key = event.key;

      if(!isNaN(key) || ['+','-','*','/','.'].includes(key)){
        appendValue(key);
      }

      else if(key === "Enter"){
        calculate();
      }

      else if(key === "Backspace"){
        backspace();
      }

      else if(key.toLowerCase() === "c"){
        clearDisplay();
      }
    });

  </script>

</body>
</html>
