<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Form</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #0f172a;
  color: white;
}
header {
  background: #020617;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
}

header h2 {
  color: #222ac5;
}

nav a {
  color: white;
  margin-left: 15px;
  text-decoration: none;
}

.form-box {
  max-width: 450px;
  margin: 60px auto;
  background: #020617;
  padding: 30px;
  border-radius: 10px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 6px;
}


.row {
  display: flex;
  gap: 10px;
}

.row input {
  width: 50%;
}


button {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}


footer {
  text-align: center;
  padding: 15px;
  background: #020617;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h2>Fixify</h2>
  <nav>
    <a href="project2.html">Home</a>
    <a href="services.html">Services</a>
  </nav>
</header>

<div class="form-box">
  <h2>Book a Service</h2>

  <form action="thankyou.html">

    <div class="row">
      <input type="text" placeholder="Your Name" required>
      <input type="tel" placeholder="Phone Number" required>
    </div>

    <select required>
      <option value="">Select Service</option>
      <option>Plumber</option>
      <option>Electrician</option>
      <option>Carpenter</option>
    </select>

    <input type="text" placeholder="Full Address" required>

    <div class="row">
      <input type="date" required>
      <input type="time" required>
    </div>

    <textarea placeholder="Describe your problem" rows="4"></textarea>
    <button type="submit">Submit Booking</button>

  </form>
</div>

<footer>
  © 2026 Fixify | Contact: 99972XXXXX
</footer>

</body>
</html>
