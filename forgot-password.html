<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Fixify</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
            background: #0f172a;
            padding: 40px 35px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #0ea6e7;
            margin-bottom: 25px;
        }

        .icon-box {
            width: 75px;
            height: 75px;
            background: rgba(14, 166, 231, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-box i {
            font-size: 30px;
            color: #0ea6e7;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #e2e8f0;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            outline: none;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0ea6e7;
            box-shadow: 0 0 0 3px rgba(14,166,231,0.12);
        }

        input::placeholder {
            color: #64748b;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
        }

        .back-login a {
            color: #0ea6e7;
            text-decoration: none;
            font-weight: bold;
        }

        .back-login a:hover {
            color: #38bdf8;
        }

        @media(max-width: 480px) {
            .forgot-container {
                padding: 30px 22px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="logo">
            FIXIFY
        </div>

        <div class="icon-box">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Don't worry! Enter your registered email address
            and we'll help you reset your password.
        </p>

        <form id="forgotPasswordForm">

            <div class="input-group">

                <label for="email">Email Address</label>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="reset-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Send Reset Link
            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="back-login">
            <i class="fa-solid fa-arrow-left"></i>
            <a href="login.html"> Back to Login</a>
        </div>

    </div>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            message.style.display = "block";
            message.style.background = "rgba(245,158,11,0.12)";
            message.style.color = "#fbbf24";

            message.textContent =
                "Frontend is ready! Password reset email functionality will be connected next.";
        });
    </script>

</body>
</html>
