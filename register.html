<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fixify | Register</title>

    <!-- Google Sign-In Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Axios Library -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #0f172a);
            padding: 20px;
            color: white;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(14px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .logo {
            text-align: center;
            color: #38bdf8;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
            color: white;
            outline: none;
        }

        .input-box input::placeholder {
            color: #cbd5e1;
        }

        .password {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
        }

        .strength {
            font-size: 13px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #22c55e, #4ade80);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #22c55e;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #ef4444;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .or-divider {
            text-align: center;
            margin: 20px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
        }

        .bottom {
            text-align: center;
            margin-top: 15px;
        }

        .bottom a {
            color: #4ade80;
            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        @media(max-width: 768px) {
            .form-container {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <div class="form-container">

        <div class="logo">
            FIXIFY
        </div>

        <h2 class="title">
            Create Account
        </h2>

        <form id="registerForm">

            <div class="input-box">
                <input
                    id="name"
                    type="text"
                    placeholder="Full Name"
                    required>
            </div>

            <div class="input-box">
                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required>
            </div>

            <div class="input-box">
                <input
                    id="phoneNumber"
                    type="tel"
                    placeholder="Phone Number"
                    required>
            </div>

            <div class="input-box password">

                <input
                    id="password"
                    type="password"
                    placeholder="Password (6-8 characters)"
                    minlength="6"
                    maxlength="8"
                    required>

                <span class="toggle" onclick="togglePass()">
                    👁
                </span>

                <div class="strength" id="strength"></div>

            </div>

            <div class="input-box">
                <input
                    id="confirm"
                    type="password"
                    placeholder="Confirm Password"
                    required>
            </div>

            <button id="btn" type="submit">
                Register
            </button>

            <div class="message" id="msg"></div>

            <div class="error-message" id="errorMsg"></div>

        </form>

        <div class="or-divider">
            OR
        </div>

        <!-- Google Sign-In Button -->

        <div class="google-btn-container">

            <div
                id="g_id_onload"
                data-client_id="878486367421-8669019j001b16b0u4vqq4rdo46c5h8g.apps.googleusercontent.com"
                data-context="signup"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div
                class="g_id_signin"
                data-type="standard"
                data-theme="outline"
                data-size="large">
            </div>

        </div>

        <div class="bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        // Backend URL
        const API_URL = "https://fixify-backend-eq17.onrender.com";


        // Show Password
        function togglePass() {

            const pass = document.getElementById('password');

            pass.type = pass.type === 'password'
                ? 'text'
                : 'password';

        }


        // Show Success Message
        function showSuccess(message) {

            const msg = document.getElementById("msg");
            const errorMsg = document.getElementById("errorMsg");

            errorMsg.style.display = "none";

            msg.innerText = message;
            msg.style.display = "block";

        }


        // Show Error Message
        function showError(message) {

            const msg = document.getElementById("msg");
            const errorMsg = document.getElementById("errorMsg");

            msg.style.display = "none";

            errorMsg.innerText = message;
            errorMsg.style.display = "block";

        }


        // GOOGLE REGISTRATION

        async function handleCredentialResponse(response) {

            try {

                if (!response || !response.credential) {

                    showError("Google credential not received.");

                    return;
                }

                showSuccess("Verifying Google account...");

                const result = await axios.post(

                    `${API_URL}/api/users/auth/google`,

                    {
                        credential: response.credential
                    },

                    {
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }

                );

                console.log("Google Backend Response:", result.data);

                if (!result.data.success) {

                    throw new Error(
                        result.data.message || "Google registration failed."
                    );

                }

                showSuccess("Google Registration Successful!");

                setTimeout(function () {

                    window.location.href = "dashboard.html";

                }, 1000);

            }

            catch (error) {

                console.error("Google Registration Error:", error);

                const errorMessage =
                    error.response?.data?.message ||
                    "Unable to connect to server. Please try again.";

                showError(errorMessage);

            }

        }


        // MANUAL REGISTRATION

        document.getElementById('registerForm').addEventListener(
            'submit',
            async function (e) {

                e.preventDefault();

                const btn = document.getElementById("btn");

                const name = document.getElementById('name').value.trim();

                const email = document.getElementById('email').value.trim();

                const phoneNumber = document.getElementById('phoneNumber').value.trim();

                const password = document.getElementById('password').value;

                const confirm = document.getElementById('confirm').value;


                // Password Validation

                if (password !== confirm) {

                    showError("Passwords don't match!");

                    return;

                }


                if (password.length < 6 || password.length > 8) {

                    showError("Password must be 6-8 characters long.");

                    return;

                }


                // User Data

                const userData = {

                    name,
                    email,
                    phoneNumber,
                    password

                };


                try {

                    btn.disabled = true;

                    btn.innerText = "Registering...";

                    showSuccess("Creating your account...");


                    const response = await axios.post(

                        `${API_URL}/api/users/create`,

                        userData,

                        {
                            headers: {
                                "Content-Type": "application/json"
                            }
                        }

                    );


                    console.log("Registration Response:", response.data);


                    if (!response.data.success) {

                        throw new Error(
                            response.data.message || "Registration failed."
                        );

                    }


                    showSuccess("Account created successfully!");


                    setTimeout(function () {

                        window.location.href = "dashboard.html";

                    }, 1500);


                }

                catch (error) {

                    console.error("Registration Error:", error);

                    const errorMessage =
                        error.response?.data?.message ||
                        error.message ||
                        "Registration failed! Please try again.";

                    showError(errorMessage);

                    btn.disabled = false;

                    btn.innerText = "Register";

                }

            }

        );

    </script>

</body>

</html>
