<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fixify | Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI';
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#020617,
#0f172a
);

padding:20px;

color:white;

}

.form-container{

width:100%;

max-width:420px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(14px);

padding:35px;

border-radius:20px;

border:
1px solid
rgba(255,255,255,.08);

}

.logo{

text-align:center;

color:#38bdf8;

font-size:30px;

font-weight:bold;

margin-bottom:15px;

}

.title{

text-align:center;

margin-bottom:25px;

}

.input-box{

margin-bottom:15px;

}

.input-box input{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:
rgba(255,255,255,.08);

color:white;

outline:none;

}

.input-box input::placeholder{

color:#cbd5e1;

}

.password{

position:relative;

}

.toggle{

position:absolute;

right:15px;

top:14px;

cursor:pointer;

}

.strength{

font-size:13px;

margin-top:8px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:
linear-gradient(
45deg,
#22c55e,
#4ade80
);

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

transform:scale(1.02);

}

.message{

display:none;

margin-top:15px;

padding:12px;

background:#22c55e;

border-radius:10px;

text-align:center;

}

.bottom{

text-align:center;

margin-top:15px;

}

.bottom a{

color:#4ade80;

text-decoration:none;

}

.bottom a:hover{

text-decoration:underline;

}

@media(max-width:768px){

.form-container{

padding:25px;

}

}

</style>

</head>

<body>

<div class="form-container">

<div class="logo">

FIXIFY

</div>

<h2 class="title">

Create Account 🚀

</h2>

<form id="registerForm">

<div class="input-box">

<input
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<input
id="email"
type="email"
placeholder="Email"
required>

</div>

<div class="input-box password">

<input
id="password"
type="password"
placeholder="Password"
required>

<span
class="toggle"
onclick="togglePass()">

👁

</span>

<div
class="strength"
id="strength">

</div>

</div>

<div class="input-box">

<input
id="confirm"
type="password"
placeholder="Confirm Password"
required>

</div>

<button id="btn">

Register

</button>

<div
class="message"
id="success">

✅ Registration Successful

</div>

</form>

<div class="bottom">

Already have account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

/* SHOW PASSWORD */

function togglePass(){

const pass=
document
.getElementById(
"password"
);

pass.type=

pass.type==="password"

?

"text"

:

"password";

}

/* STRENGTH */

password
.addEventListener(

"input",

()=>{

let value=
password.value;

if(
value.length<6
){

strength.innerHTML=
"Weak Password";

strength.style.color=
"red";

}

else if(
value.length<10
){

strength.innerHTML=
"Medium Password";

strength.style.color=
"orange";

}

else{

strength.innerHTML=
"Strong Password";

strength.style.color=
"#22c55e";

}

});

/* REGISTER */

registerForm
.addEventListener(

"submit",

e=>{

e.preventDefault();

if(
password.value
!==

confirm.value
){

alert(
"Passwords do not match"
);

return;

}

btn.innerHTML=
"Creating...";

setTimeout(()=>{

success.style.display=
"block";

btn.innerHTML=
"Registered";

setTimeout(()=>{

window.location.href=
"login.html";

},1800);

},1500);

});

</script>

</body>
</html>
