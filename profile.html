<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Fixify</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* UNIFIED SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #020617;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            transition: left 0.3s ease;
            z-index: 1000;
            border-right: 1px solid #1e293b;
        }

        .sidebar.hidden {
            left: -240px;
        }

        /* Padding left ensures hamburger/close button never overlaps Fixify text */
        .sidebar h2 {
            color: #0ea6e7;
            margin-bottom: 30px;
            padding-left: 42px;
            font-size: 24px;
            line-height: 32px;
        }

        .sidebar a {
            display: block;
            color: #cbd5f5;
            text-decoration: none;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #38bdf8;
            font-weight: bold;
        }

        .sidebar a.logout {
            margin-top: 25px;
            color: #f87171 !important;
        }

        /* HAMBURGER / CLOSE BUTTON */
        .hamburger {
            width: 38px;
            height: 38px;
            font-size: 22px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            z-index: 1100;
            position: fixed;
            left: 14px;
            top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            padding: 25px;
            transition: margin-left 0.3s ease;
            margin-left: 240px;
            min-width: 0;
        }

        .main.shifted {
            margin-left: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 50px;
            margin-bottom: 30px;
        }

        /* PROFILE CARD */
        .profile-card {
            max-width: 520px;
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            margin: 0 auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .profile-card h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-group input:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-save {
            width: 100%;
            padding: 13px;
            background: #22c55e;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-save:hover:not(:disabled) {
            background: #16a34a;
        }

        .btn-save:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
            padding: 10px;
            border-radius: 6px;
        }

        @media(max-width: 768px) {
            .sidebar {
                left: -240px;
            }
            .sidebar.show {
                left: 0;
            }
            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- HAMBURGER BUTTON -->
    <button class="hamburger" id="toggleButton" aria-label="Toggle Menu">☰</button>

    <!-- UNIFIED SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <h2>Fixify</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="mybookings.html">My Bookings</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="index.html">Back to Home</a>
        <a href="#" class="logout" id="logoutButton">Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main" id="mainContent">
        <div class="header">
            <h1>My Profile 👤</h1>
        </div>

        <div class="profile-card">
            <h3>Update Your Details</h3>
            <form id="profileForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" placeholder="Enter your 10-digit phone number">
                </div>

                <button type="submit" class="btn-save" id="saveProfileBtn">Save Changes</button>
                <div class="status-msg" id="statusMsg"></div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://fixify-backend-eq17.onrender.com";

        // SIDEBAR TOGGLE WITH ☰ <-> ✕ ICON CHANGE
        const toggleButton = document.getElementById("toggleButton");
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");

        function updateHamburgerIcon() {
            const isMobile = window.innerWidth <= 768;
            const isOpen = isMobile
                ? sidebar.classList.contains("show")
                : !sidebar.classList.contains("hidden");
            toggleButton.textContent = isOpen ? "✕" : "☰";
        }

        toggleButton.addEventListener("click", () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle("show");
            } else {
                sidebar.classList.toggle("hidden");
                mainContent.classList.toggle("shifted");
            }
            updateHamburgerIcon();
        });

        window.addEventListener("resize", updateHamburgerIcon);

        // LOAD PROFILE
        window.addEventListener("DOMContentLoaded", () => {
            updateHamburgerIcon();

            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                document.getElementById("name").value = user.name || "";
                document.getElementById("email").value = user.email || "";
                document.getElementById("phoneNumber").value = user.phoneNumber || user.phone || "";
            } catch (err) {
                console.error("Error reading user data:", err);
            }
        });

        // UPDATE PROFILE
        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventEvent();
            const token = localStorage.getItem("token");
            const saveBtn = document.getElementById("saveProfileBtn");
            const statusMsg = document.getElementById("statusMsg");

            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";
            statusMsg.style.display = "none";

            const updatedName = document.getElementById("name").value.trim();
            const updatedEmail = document.getElementById("email").value.trim();
            const updatedPhone = document.getElementById("phoneNumber").value.trim();

            try {
                const res = await fetch(`${API_URL}/api/users/profile`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: updatedName,
                        email: updatedEmail,
                        phoneNumber: updatedPhone
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Failed to update profile");

                const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
                const newUser = {
                    ...currentUser,
                    name: updatedName,
                    email: updatedEmail,
                    phoneNumber: updatedPhone
                };
                localStorage.setItem("user", JSON.stringify(newUser));

                statusMsg.textContent = "Profile updated successfully! ✅";
                statusMsg.style.background = "#16a34a";
                statusMsg.style.color = "white";
                statusMsg.style.display = "block";
            } catch (err) {
                statusMsg.textContent = err.message || "Could not update profile.";
                statusMsg.style.background = "#ef4444";
                statusMsg.style.color = "white";
                statusMsg.style.display = "block";
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Changes";
            }
        });

        // LOGOUT
        document.getElementById("logoutButton").addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });
    </script>
</body>

</html>
