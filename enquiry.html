<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixify | Enquiry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),

url(
"https://images.unsplash.com/photo-1556740749-887f6717d7e4"
);

background-size:cover;

color:white;

}

/* NAV */

header{

background:#020617;

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 40px;

position:sticky;

top:0;

z-index:1000;

}

.logo{

color:#38bdf8;

font-size:28px;

font-weight:bold;

}

.menu{

display:flex;

gap:20px;

}

.menu a{

color:white;

text-decoration:none;

}

.menu a:hover{

color:#38bdf8;

}

.menu-btn{

display:none;

font-size:28px;

cursor:pointer;

}

/* FORM */

.wrapper{

display:flex;

justify-content:center;

padding:60px 20px;

}

.form-container{

width:100%;

max-width:550px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

padding:35px;

border-radius:20px;

}

.form-title{

text-align:center;

margin-bottom:25px;

}

input,
textarea,
select{

width:100%;

padding:14px;

margin:10px 0;

border:none;

border-radius:10px;

outline:none;

}

textarea{

resize:none;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.02);

}

.counter{

text-align:right;

font-size:13px;

color:#cbd5e1;

}

.success{

display:none;

margin-top:15px;

padding:15px;

background:#22c55e;

border-radius:10px;

text-align:center;

}

/* TOP */

#topBtn{

position:fixed;

right:20px;

bottom:20px;

padding:14px;

border:none;

border-radius:50%;

background:#38bdf8;

display:none;

cursor:pointer;

}

/* MOBILE */

@media(max-width:768px){

header{
padding:18px;
}

.menu-btn{
display:block;
}

.menu{

display:none;

position:absolute;

top:70px;

left:0;

width:100%;

background:#020617;

flex-direction:column;

padding:20px;

text-align:center;

}

.menu.active{
display:flex;
}

.form-container{
padding:25px;
}

}

footer{

background:#020617;

padding:20px;

text-align:center;

}

</style>

</head>

<body>

<header>

<div class="logo">
FIXIFY
</div>

<div class="menu-btn" id="menuBtn">
☰
</div>

<div class="menu" id="menu">

<a href="project2.html">
Home
</a>

<a href="service.html">
Services
</a>

<a href="about.html">
About
</a>

</div>

</header>

<div class="wrapper">

<div class="form-container">

<h2 class="form-title">

Send Enquiry

</h2>

<form id="enquiryForm">

<input
id="name"
placeholder="Your Name"
required>

<input
id="phone"
type="tel"
placeholder="Phone Number"
required>

<select
id="service"
required>

<option value="">
Select Service
</option>

<option>
Plumber
</option>

<option>
Electrician
</option>

<option>
Carpenter
</option>

</select>

<textarea

id="problem"

rows="4"

placeholder="Describe your problem"

></textarea>

<div class="counter">

<span id="count">

0

</span>

/150

</div>

<input
id="address"
placeholder="Address"
required>

<input
type="date"
required>

<button id="submitBtn">

Submit Enquiry

</button>

<div
class="success"
id="success">

✅ Enquiry Submitted

</div>

</form>

</div>

</div>

<button id="topBtn">
↑
</button>

<footer>

© 2026 Fixify

</footer>

<script>

/* MENU */

menuBtn.onclick=()=>{

menu.classList.toggle("active");

};

/* COUNTER */

problem
.addEventListener(

"input",

()=>{

count.innerHTML=

problem.value.length;

});

/* FORM */

enquiryForm
.addEventListener(

"submit",

e=>{

e.preventDefault();

submitBtn.innerHTML=
"Submitting...";

setTimeout(()=>{

success.style.display=
"block";

submitBtn.innerHTML=
"Submitted";

enquiryForm.reset();

count.innerHTML=
0;

},1500);

});

/* TOP */

window.addEventListener(

"scroll",

()=>{

topBtn.style.display=

window.scrollY>300

?

"block"

:

"none";

});

topBtn.onclick=()=>{

window.scrollTo({

top:0,

behavior:"smooth"

});

};

</script>

</body>

</html>
