<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixify | Enquiry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),

url(
"https://images.unsplash.com/photo-1556740749-887f6717d7e4"
);

background-size:cover;

color:white;

}

/* NAV */

header{

background:#020617;

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 40px;

position:sticky;

top:0;

z-index:1000;

}

.logo{

color:#38bdf8;

font-size:28px;

font-weight:bold;

}

.menu{

display:flex;

gap:20px;

}

.menu a{

color:white;

text-decoration:none;

}

.menu a:hover{

color:#38bdf8;

}

.menu-btn{

display:none;

font-size:28px;

cursor:pointer;

}

/* FORM */

.wrapper{

display:flex;

justify-content:center;

padding:60px 20px;

}

.form-container{

width:100%;

max-width:550px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

padding:35px;

border-radius:20px;

}

.form-title{

text-align:center;

margin-bottom:25px;

}

input,
textarea,
select{

width:100%;

padding:14px;

margin:10px 0;

border:none;

border-radius:10px;

outline:none;

}

textarea{

resize:none;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.02);

}

.counter{

text-align:right;

font-size:13px;

color:#cbd5e1;

}

.success{

display:none;

margin-top:15px;

padding:15px;

background:#22c55e;

border-radius:10px;

text-align:center;

}

/* TOP */

#topBtn{

position:fixed;

right:20px;

bottom:20px;

padding:14px;

border:none;

border-radius:50%;

background:#38bdf8;

display:none;

cursor:pointer;

}

/* MOBILE */

@media(max-width:768px){

header{
padding:18px;
}

.menu-btn{
display:block;
}

.menu{

display:none;

position:absolute;

top:70px;

left:0;

width:100%;

background:#020617;

flex-direction:column;

padding:20px;

text-align:center;

}

.menu.active{
display:flex;
}

.form-container{
padding:25px;
}

}

footer{

background:#020617;

padding:20px;

text-align:center;

}

</style>

</head>

<body>

<header>

<div class="logo">
FIXIFY
</div>

<div class="menu-btn" id="menuBtn">
☰
</div>

<div class="menu" id="menu">

<a href="index.html">
Home
</a>

<a href="service.html">
Services
</a>

<a href="about.html">
About
</a>

</div>

</header>

<div class="wrapper">

<div class="form-container">

<h2 class="form-title">

Send Enquiry

</h2>

<form id="enquiryForm">

<input type="text" id="name" placeholder="Your Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<!-- Added Email Input Field -->
<input type="email" id="email" placeholder="Your Email" required>

<select id="service">

<option value="" disabled selected>

Select Service

</option>

<option value="plumber">
Plumber
</option>

<option value="electrician">
Electrician
</option>

<option value="carpenter">

Carpenter

</option>

</select>

<textarea id="message" placeholder="Describe your problem" maxlength="250" required></textarea>

<p class="counter">
0/250
</p>

<input type="text" id="address" placeholder="Address" required>

<button type="submit">
Submit Enquiry
</button>

<div class="success" id="success">
✓ Enquiry Submitted
</div>

</form>

</div>

</div>

<footer>
© 2024 Fixify
</footer>

<button id="topBtn">
↑
</button>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>

/* MOBILE MENU */

const menuBtn = document.getElementById('menuBtn');

const menu = document.getElementById('menu');

menuBtn.addEventListener('click',() => {

menu.classList.toggle('active');

});

/* TEXTAREA COUNTER */

const textarea = document.getElementById('message');

const counter = document.querySelector('.counter');

textarea.addEventListener('input',() => {

const text = textarea.value;

counter.textContent = `${text.length}/250`;

});

/* SCROLL TOP */

const topBtn = document.getElementById('topBtn');

window.addEventListener('scroll',() => {

if(window.scrollY > 300){

topBtn.style.display = 'block';

}else{

topBtn.style.display = 'none';

}

});

topBtn.addEventListener('click',() => {

window.scrollTo(0,0);

});

/* ENQUIRY FORM */

document.getElementById('enquiryForm').addEventListener('submit', function(e) {

e.preventDefault();

const name = document.getElementById('name').value;

const phone = document.getElementById('phone').value;

const email = document.getElementById('email').value; // Get Email Value

const service = document.getElementById('service').value;

const message = document.getElementById('message').value;

const address = document.getElementById('address').value;

const enquiryData = {
name,
phone,
email, // Send Email Data
service,
message,
address
};

axios.post("https://fixify-backend-eq17.onrender.com/api/users/enquiry", enquiryData)

.then(function(response) {

console.log('Success:', response.data);

document.getElementById('success').style.display = 'block';

document.getElementById('enquiryForm').reset();

counter.textContent = '0/250';

})

.catch(function(error) {

console.error('Error:', error);

alert('Enquiry submit nahi hui');

});

});

</script>

</body>

</html>
