<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixify | Login</title>

    <!-- Google Sign-In Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Axios Library -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #0f172a);
            padding: 20px;
            color: white;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(14px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .logo {
            text-align: center;
            color: #38bdf8;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
            color: white;
            outline: none;
        }

        .input-box input::placeholder {
            color: #cbd5e1;
        }

        .password {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #4ade80;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #22c55e, #4ade80);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.3s ease;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.85;
            cursor: not-allowed;
            transform: none;
        }

        /* Error notification translucent design */
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            border-radius: 10px;
            text-align: center;
            color: #f87171;
            font-weight: bold;
        }

        .or-divider {
            text-align: center;
            margin: 20px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
        }

        .bottom {
            text-align: center;
            margin-top: 15px;
        }

        .bottom a {
            color: #4ade80;
            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        @media(max-width: 768px) {
            .form-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <div class="logo">FIXIFY</div>
        <h2 class="title">Welcome Back</h2>

        <form id="loginForm">
            <div class="input-box">
                <input id="email" type="email" placeholder="Email" required>
            </div>

            <div class="input-box password">
                <input id="password" type="password" placeholder="Password" required>
                <span class="toggle" onclick="togglePass()">👁</span>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button id="btn" type="submit">Login</button>

            <!-- Only Error Alert shown as box -->
            <div class="error-message" id="errorMsg"></div>
        </form>

        <div class="or-divider">OR</div>

        <!-- Google Sign-In Button -->
        <div class="google-btn-container">
            <div id="g_id_onload" 
                 data-client_id="878486367421-8669019j001b16b0u4vqq4rdo46c5h8g.apps.googleusercontent.com"
                 data-context="signin" 
                 data-ux_mode="popup" 
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin" 
                 data-type="standard" 
                 data-theme="outline" 
                 data-size="large">
            </div>
        </div>

        <div class="bottom">
            Don't have account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        const API_URL = "https://fixify-backend-eq17.onrender.com";

        function togglePass() {
            const pass = document.getElementById('password');
            pass.type = pass.type === 'password' ? 'text' : 'password';
        }

        function showError(message) {
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.innerText = message;
            errorMsg.style.display = "block";
        }

        // 1. GOOGLE SIGN-IN HANDLER
        async function handleCredentialResponse(response) {
            const btn = document.getElementById("btn");
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            try {
                if (!response || !response.credential) {
                    showError("Google login failed.");
                    return;
                }

                btn.disabled = true;
                btn.innerText = "Authenticating with Google... ";

                const result = await axios.post(`${API_URL}/api/users/auth/google`, {
                    credential: response.credential
                }, {
                    headers: { "Content-Type": "application/json" }
                });

                if (!result.data.success) {
                    throw new Error(result.data.message || "Google Authentication failed.");
                }

                localStorage.setItem("token", result.data.token);
                localStorage.setItem("user", JSON.stringify(result.data.user));

                btn.innerText = "Login Successful! Redirecting... 🎉";
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);

            } catch (error) {
                console.error("Google Login Error:", error);
                btn.disabled = false;
                btn.innerText = "Login";
                showError(error.response?.data?.message || "Google authentication failed.");
            }
        }

        // 2. MANUAL LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById("btn");
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                btn.disabled = true;
                btn.innerText = "Logging in... ";

                const response = await axios.post(`${API_URL}/api/users/login`, {
                    email,
                    password
                }, {
                    headers: { "Content-Type": "application/json" }
                });

                if (!response.data.success) {
                    throw new Error(response.data.message || "Login failed.");
                }

                localStorage.setItem("token", response.data.token);
                localStorage.setItem("user", JSON.stringify(response.data.user));

                btn.innerText = "Login Successful! Redirecting... ";
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);

            } catch (error) {
                console.error("Login Error:", error);
                btn.disabled = false;
                btn.innerText = "Login";
                showError(error.response?.data?.message || "Invalid Email or Password.");
            }
        });
    </script>
</body>

</html>
