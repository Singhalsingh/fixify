<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fixify | Login</title>

    <!-- Google Sign-In Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(14px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .input {
            margin-bottom: 16px;
            position: relative;
        }

        .input input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, .08);
            color: white;
        }

        .input input::placeholder {
            color: #cbd5e1;
        }

        .eye {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .row a,
        .bottom a {
            color: #4ade80;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(45deg, #22c55e, #4ade80);
            color: white;
            font-size: 16px;
        }

        .login-btn:hover {
            transform: scale(1.02);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .or-divider {
            text-align: center;
            margin: 20px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            min-height: 45px;
        }

        .bottom {
            text-align: center;
            margin-top: 18px;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: white;
        }

        .error {
            display: block;
            background: #991b1b;
        }

        .success {
            display: block;
            background: #166534;
        }

        @media(max-width: 768px) {
            .container {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">FIXIFY</div>

        <h2 class="title">Welcome Back</h2>

        <!-- Normal Login Form -->

        <form id="loginForm">

            <div class="input">

                <input
                    id="user"
                    type="email"
                    placeholder="Email"
                    required>

            </div>

            <div class="input">

                <input
                    id="pass"
                    type="password"
                    placeholder="Password (6-8 characters)"
                    minlength="6"
                    maxlength="8"
                    required>

                <span class="eye" onclick="togglePass()">👁</span>

            </div>

            <div class="row">

                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember Me
                </label>

                <a href="forgot-password.html">Forgot Password?</a>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="btn">

                Login

            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="or-divider">OR</div>

        <!-- Google Login -->

        <div class="google-btn-container">

            <div
                id="g_id_onload"
                data-client_id="878486367421-8669019j001b16b0u4vqq4rdo46c5h8g.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div
                class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left">
            </div>

        </div>

        <div class="bottom">

            Don't have account?

            <a href="register.html">Register</a>

        </div>

    </div>


    <script>

        // Backend URL

        const API_URL = "https://fixify-backend-eq17.onrender.com";


        // Password Show / Hide

        function togglePass() {

            const pass = document.getElementById("pass");

            pass.type =
                pass.type === "password"
                    ? "text"
                    : "password";

        }


        // Message Function

        function showMessage(text, type) {

            const message = document.getElementById("message");

            message.textContent = text;

            message.className = "message " + type;

        }


        // Save Login Data

        function saveLoginData(data) {

            if (!data.token || !data.user) {

                throw new Error(
                    "Login successful, but authentication data was not received."
                );

            }

            // Save JWT Token

            localStorage.setItem("token", data.token);

            // Save User Details

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

        }


        // API Response Handler

        async function getResponseData(response) {

            const contentType =
                response.headers.get("content-type") || "";

            if (!contentType.includes("application/json")) {

                throw new Error(
                    "Server returned an invalid response. Please try again."
                );

            }

            const data = await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message || "Authentication failed."
                );

            }

            return data;

        }


        // NORMAL EMAIL LOGIN

        document.getElementById("loginForm").addEventListener(

            "submit",

            async function(e) {

                e.preventDefault();

                const btn = document.getElementById("btn");

                const email =
                    document.getElementById("user").value.trim();

                const password =
                    document.getElementById("pass").value;


                if (password.length < 6 || password.length > 8) {

                    showMessage(
                        "Password must be 6-8 characters long.",
                        "error"
                    );

                    return;

                }


                try {

                    btn.disabled = true;

                    btn.innerText = "Logging in...";

                    showMessage(
                        "Verifying your account...",
                        "success"
                    );


                    const response = await fetch(

                        `${API_URL}/api/users/login`,

                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }

                    );


                    const data = await getResponseData(response);


                    console.log(
                        "Login Successful:",
                        data
                    );


                    // SAVE TOKEN AND USER

                    saveLoginData(data);


                    showMessage(
                        "Login Successful!",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href = "./dashboard.html";

                    }, 1000);


                }

                catch(error) {

                    console.error(
                        "Normal Login Error:",
                        error
                    );

                    showMessage(
                        error.message || "Unable to connect to server.",
                        "error"
                    );

                    btn.disabled = false;

                    btn.innerText = "Login";

                }

            }

        );


        // GOOGLE LOGIN

        async function handleCredentialResponse(response) {

            try {

                if (!response || !response.credential) {

                    throw new Error(
                        "Google credential not received."
                    );

                }


                showMessage(
                    "Verifying Google account...",
                    "success"
                );


                const result = await fetch(

                    `${API_URL}/api/users/auth/google`,

                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            credential: response.credential

                        })

                    }

                );


                const data = await getResponseData(result);


                console.log(
                    "Google Login Response:",
                    data
                );


                // SAVE GOOGLE TOKEN AND USER

                saveLoginData(data);


                showMessage(
                    "Google Login Successful!",
                    "success"
                );


                setTimeout(() => {

                    window.location.href = "./dashboard.html";

                }, 1000);


            }

            catch(error) {

                console.error(
                    "Google Login Error:",
                    error
                );

                showMessage(
                    error.message || "Unable to connect to server.",
                    "error"
                );

            }

        }

    </script>

</body>

</html>
