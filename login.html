<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fixify | Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI';
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:
linear-gradient(
135deg,
#020617,
#0f172a
);

color:white;

}

.container{

width:100%;

max-width:420px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(14px);

padding:35px;

border-radius:20px;

border:
1px solid
rgba(255,255,255,.08);

}

.logo{

text-align:center;

font-size:30px;

font-weight:bold;

color:#38bdf8;

margin-bottom:15px;

}

.title{

text-align:center;

margin-bottom:25px;

}

.input{

margin-bottom:16px;

position:relative;

}

.input input{

width:100%;

padding:14px;

border:none;

border-radius:10px;

outline:none;

background:
rgba(255,255,255,.08);

color:white;

}

.input input::placeholder{

color:#cbd5e1;

}

.eye{

position:absolute;

right:15px;

top:14px;

cursor:pointer;

}

.row{

display:flex;

justify-content:space-between;

font-size:14px;

margin-bottom:20px;

}

.row a{

color:#4ade80;

text-decoration:none;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

cursor:pointer;

background:
linear-gradient(
45deg,
#22c55e,
#4ade80
);

color:white;

font-size:16px;

}

button:hover{

transform:scale(1.02);

}

.success{

display:none;

margin-top:15px;

padding:12px;

background:#22c55e;

border-radius:10px;

text-align:center;

}

.bottom{

text-align:center;

margin-top:18px;

}

.bottom a{

color:#4ade80;

text-decoration:none;

}

@media(max-width:768px){

.container{
padding:25px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

FIXIFY

</div>

<h2 class="title">

Welcome Back 👋

</h2>

<form id="loginForm">

<div class="input">

<input
id="user"

placeholder="Username / Email"

required>

</div>

<div class="input">

<input
id="pass"

type="password"

placeholder="Password"

required>

<span
class="eye"

onclick="togglePass()">

👁

</span>

</div>

<div class="row">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button id="btn">

Login

</button>

<div
class="success"

id="success">

✅ Login Successful

</div>

</form>

<div class="bottom">

Don't have account?

<a href="register.html">

Register

</a>

</div>

</div>

<script>

/* SHOW PASSWORD */

function togglePass(){

const pass=
document
.getElementById(
"pass"
);

pass.type=

pass.type==="password"

?

"text"

:

"password";

}

/* LOGIN */

loginForm
.addEventListener(

"submit",

e=>{

e.preventDefault();

if(

user.value.length<3

){

alert(
"Enter valid username"
);

return;

}

if(

pass.value.length<6

){

alert(
"Password too short"
);

return;

}

btn.innerHTML=
"Logging in...";

setTimeout(()=>{

success.style.display=
"block";

btn.innerHTML=
"Success";

setTimeout(()=>{

window.location.href=
"dashboard.html";

},1800);

},1500);

});

</script>

</body>
</html>
